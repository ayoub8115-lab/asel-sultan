<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asel Sultan | Pure Honey</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="hero-page">
    <header class="navbar">
      <a href="#" class="logo">
        <img src="logo.png" alt="Asel Sultan Logo">
      </a>

      <nav class="menu">
        <a href="#">Home</a>
        <a href="#product">Product</a>
        <a href="#service">Service</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <div class="left-content">
        <div class="healthy">HEALTHY</div>

        <h1>PURE <span>HONEY</span></h1>

        <h2>Natural <span>Asel Sultan</span></h2>

        <div class="underline"></div>

        <p class="description">
          عسل السلطان، عسل طبيعي فاخر بمذاق غني وجودة عالية. اطلب الآن عبر واتساب والدفع عند الاستلام.
        </p>

        <div class="buy-area">
          <a href="#" id="whatsappBtn" class="buy-btn" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-whatsapp"></i>
            BUY NOW
          </a>

          <div class="price-box">
            <span class="old-price">DH 200</span>
            <strong id="totalPrice">DH 600</strong>
          </div>
        </div>

        <div class="qty-box">
          <button type="button" id="minusBtn">−</button>
          <span id="qtyValue">4</span>
          <button type="button" id="plusBtn">+</button>
        </div>
      </div>

      <div class="right-content" id="product">
        <div class="honey-shape">
          <img src="product1.jpg" class="slide active" alt="Asel Sultan Product 1">
          <img src="product2.jpg" class="slide" alt="Asel Sultan Product 2">
          <img src="product3.jpg" class="slide" alt="Asel Sultan Product 3">
        </div>

        <div class="top-circle">
          <img src="product1.jpg" alt="Asel Sultan small product">
        </div>

        <div class="cut-line line-one"></div>
        <div class="cut-line line-two"></div>
        <div class="cut-line line-three"></div>

        <div class="thumbs">
          <button class="thumb active" type="button" data-slide="0">
            <img src="product1.jpg" alt="product 1">
          </button>
          <button class="thumb" type="button" data-slide="1">
            <img src="product2.jpg" alt="product 2">
          </button>
          <button class="thumb" type="button" data-slide="2">
            <img src="product3.jpg" alt="product 3">
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
