<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asel Sultan | عسل السلطان</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Baloo+Bhaijaan+2:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page-wrap">
    <section class="shop-card">

      <header class="topbar">
        <a href="#" class="home-logo" aria-label="Asel Sultan">
          <img src="logo.png" alt="Asel Sultan Logo">
        </a>

        <nav class="menu" aria-label="Navigation">
          <a href="#" class="active">الرئيسية</a>
          <a href="#product"><span>New</span>المنتج</a>
          <a href="#about">الفوائد</a>
          <a href="#contact">تواصل</a>
        </nav>

        <div class="top-actions">
          <div class="search">
            <input type="text" placeholder="Type here" aria-label="Search">
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>

          <a class="profile" href="#contact" aria-label="Contact">
            <i class="fa-regular fa-user"></i>
          </a>
        </div>
      </header>

      <div class="hero">
        <section class="copy">
          <p class="mini-title">PREMIUM NATURAL HONEY</p>

          <h1>
            عسل السلطان
            <span>Asel Sultan</span>
          </h1>

          <p class="wide-text">TASTE LOCAL PREMIUM HONEY</p>

          <div class="qty-card" id="product">
            <span>Choose your quantity</span>

            <div class="qty-row">
              <button class="qty-circle" id="minusBtn" type="button" aria-label="Minus">
                <i class="fa-solid fa-chevron-down"></i>
              </button>

              <strong id="qtyValue">4</strong>

              <button class="qty-circle" id="plusBtn" type="button" aria-label="Plus">
                <i class="fa-solid fa-chevron-up"></i>
              </button>
            </div>
          </div>

          <div class="price-row">
            <span class="old">DH 200</span>
            <span class="new" id="totalPrice">DH 600</span>
          </div>

          <a class="buy-button" id="whatsappBtn" target="_blank" rel="noopener noreferrer">
            <span class="icon-round">
              <i class="fa-brands fa-whatsapp"></i>
            </span>
            <span>اطلب الآن</span>
          </a>
        </section>

        <section class="visual">
          <div class="main-circle">
            <img src="product1.jpg" alt="Asel Sultan honey" class="product-slide active">
            <img src="product2.jpg" alt="Asel Sultan honey" class="product-slide">
            <img src="product3.jpg" alt="Asel Sultan honey" class="product-slide">
          </div>

          <div class="float-label label-top">100% Natural</div>
          <div class="float-label label-bottom">Royal Taste!</div>

          <div class="thumbs">
            <button class="thumb active" type="button" data-slide="0">
              <img src="product1.jpg" alt="Product image 1">
            </button>
            <button class="thumb" type="button" data-slide="1">
              <img src="product2.jpg" alt="Product image 2">
            </button>
            <button class="thumb" type="button" data-slide="2">
              <img src="product3.jpg" alt="Product image 3">
            </button>
          </div>

          <a class="continue" href="#about">
            Continue shopping
            <i class="fa-solid fa-arrow-left-long"></i>
          </a>
        </section>
      </div>

      <section class="benefits" id="about">
        <div><i class="fa-solid fa-leaf"></i><strong>100% طبيعي</strong></div>
        <div><i class="fa-solid fa-bolt"></i><strong>طاقة غنية</strong></div>
        <div><i class="fa-solid fa-gem"></i><strong>جودة ممتازة</strong></div>
        <div><i class="fa-solid fa-truck-fast"></i><strong>توصيل سريع</strong></div>
      </section>

    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
