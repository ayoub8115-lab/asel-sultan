<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asel Sultan</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="product-card">

        <div class="image-section">
            <img src="product1.jpg" alt="Asel Sultan" class="product-image">
        </div>

        <div class="content-section">

            <div class="price-box">
                <div class="old-price">
                    <h3>السعر قبل التخفيض</h3>
                    <span>DH 200</span>
                </div>

                <div class="new-price">
                    <h3>السعر الحالي</h3>
                    <span>DH 150</span>
                </div>
            </div>

            <div class="quantity-box">
                <h3>الكمية</h3>

                <div class="buttons">
                    <button onclick="setQuantity(1)">1</button>
                    <button onclick="setQuantity(2)">2</button>
                    <button onclick="setQuantity(3)">3</button>
                    <button onclick="setQuantity(4)">4+</button>
                </div>
            </div>

            <div class="total-box">
                <h3>الإجمالي</h3>
                <span id="totalPrice">DH 150</span>
            </div>

            <div class="action-buttons">

                <button class="confirm-btn">
                    تأكيد الطلب
                </button>

                <a id="whatsappBtn" class="whatsapp-btn" target="_blank">
                    <i class="fab fa-whatsapp"></i>
                    اطلب عبر واتساب
                </a>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>
</body>
</html>
